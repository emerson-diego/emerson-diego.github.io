<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Layered validation flow</title>
  <desc id="desc">Implementation is checked with unit, integration, and end-to-end tests, then completed with manual acceptance and exploratory validation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d2e" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.10" />
    </filter>
  </defs>
  <rect width="960" height="430" rx="12" fill="#fffdf9" />
  <text x="480" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#0b3d2e">Validation is layered, not a single green check</text>

  <rect x="42" y="92" width="190" height="174" rx="10" fill="#eef5f1" stroke="#0b3d2e" stroke-width="2" filter="url(#shadow)" />
  <text x="137" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0b3d2e">Unit</text>
  <text x="137" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#1a1a1a">fast feedback</text>
  <text x="137" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#555">local rules</text>
  <text x="137" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#555">small contracts</text>

  <line x1="232" y1="179" x2="270" y2="179" stroke="#0b3d2e" stroke-width="3" marker-end="url(#arrow)" />

  <rect x="270" y="92" width="190" height="174" rx="10" fill="#f5f0e8" stroke="#b45309" stroke-width="2" filter="url(#shadow)" />
  <text x="365" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0b3d2e">Integration</text>
  <text x="365" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#1a1a1a">service boundaries</text>
  <text x="365" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#555">schemas and adapters</text>
  <text x="365" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#555">failure paths</text>

  <line x1="460" y1="179" x2="498" y2="179" stroke="#0b3d2e" stroke-width="3" marker-end="url(#arrow)" />

  <rect x="498" y="92" width="190" height="174" rx="10" fill="#edf3f5" stroke="#356a73" stroke-width="2" filter="url(#shadow)" />
  <text x="593" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0b3d2e">E2E</text>
  <text x="593" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#1a1a1a">real capability path</text>
  <text x="593" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#555">API / persistence</text>
  <text x="593" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#555">external contracts</text>

  <line x1="688" y1="179" x2="726" y2="179" stroke="#0b3d2e" stroke-width="3" marker-end="url(#arrow)" />

  <rect x="726" y="92" width="190" height="174" rx="10" fill="#f2eee8" stroke="#6b6258" stroke-width="2" filter="url(#shadow)" />
  <text x="821" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0b3d2e">Manual</text>
  <text x="821" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#1a1a1a">acceptance + exploration</text>
  <text x="821" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#555">operator workflow</text>
  <text x="821" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#555">UX / recovery / security</text>

  <text x="480" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#555">Feedback from every layer informs the next implementation slice</text>
  <path d="M 821 292 C 821 405, 137 405, 137 292" fill="none" stroke="#0b3d2e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
</svg>
